<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="내 명함">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="내 명함">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#18344a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>이선정 | (주)네오텍</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #18344a;
      --teal: #167c75;
      --ink: #172b3a;
      --muted: #647784;
      --line: #dce4e8;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      background: #edf2f4;
    }

    .card {
      position: relative;
      width: min(100%, 920px);
      min-height: 480px;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(270px, .8fr);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(24, 52, 74, .08);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(24, 52, 74, .14);
    }

    .identity {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: clamp(38px, 6vw, 66px);
    }

    .brand {
      display: flex;
      align-items: center;
    }

    .brand-logo {
      width: min(245px, 70%);
      height: auto;
      display: block;
    }

    .language-switch {
      position: absolute;
      top: clamp(38px, 6vw, 66px);
      right: clamp(38px, 6vw, 66px);
      display: flex;
      padding: 3px;
      background: #edf2f4;
      border-radius: 10px;
    }

    .lang-button {
      min-height: 34px;
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: .76rem;
      font-weight: 750;
      cursor: pointer;
    }

    .lang-button.active { color: #fff; background: var(--navy); }

    .intro { margin: auto 0; padding: 38px 0; }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(3rem, 7vw, 5rem);
      line-height: .98;
      letter-spacing: -.07em;
      font-weight: 850;
    }

    .card[data-lang="en"] h1 { font-size: clamp(2.5rem, 5.5vw, 4.2rem); letter-spacing: -.045em; }

    .role {
      margin: 16px 0 0;
      font-size: clamp(1.08rem, 2.4vw, 1.42rem);
      font-weight: 750;
    }

    .headline {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 25px 0 0;
      color: var(--teal);
      font-size: clamp(1.1rem, 2.4vw, 1.38rem);
      font-weight: 800;
    }

    .headline::before {
      content: "";
      width: 22px;
      height: 3px;
      background: currentColor;
      border-radius: 2px;
    }

    .contact {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      margin: 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-style: normal;
      font-size: .92rem;
      line-height: 1.55;
    }

    .contact dt { color: var(--muted); font-weight: 700; }
    .contact dd { margin: 0; overflow-wrap: anywhere; }
    .contact a { color: var(--ink); text-decoration: none; }

    .qr-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 42px 34px;
      color: #fff;
      text-align: center;
      background: var(--navy);
    }

    .qr-frame {
      width: min(100%, 260px);
      aspect-ratio: 1;
      padding: 13px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .14);
    }

    .qr-image { width: 100%; height: 100%; display: block; object-fit: contain; }
    .qr-title { margin: 20px 0 4px; font-weight: 800; font-size: 1rem; }
    .qr-note { margin: 0; color: rgba(255, 255, 255, .72); font-size: .78rem; line-height: 1.5; }

    .actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 20px;
    }

    .button {
      min-height: 45px;
      display: grid;
      place-items: center;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 10px;
      color: #fff;
      background: transparent;
      font: inherit;
      font-size: .86rem;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }

    .button.primary { color: var(--navy); background: #fff; border-color: #fff; }
    .button.save-card { grid-column: 1 / -1; color: #fff; background: var(--teal); border-color: var(--teal); }
    .button:focus-visible { outline: 3px solid #6ed0c7; outline-offset: 3px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 10;
      max-width: calc(100% - 32px);
      padding: 13px 20px;
      color: #fff;
      background: rgba(17, 37, 51, .96);
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      font-size: .9rem;
      font-weight: 750;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 680px) {
      body { padding-inline: 12px; }
      .card { width: min(100%, 430px); min-height: 0; grid-template-columns: 1fr; }
      .identity { padding: 30px 28px 28px; }
      .language-switch { top: 30px; right: 28px; }
      .brand-logo { width: min(190px, 55%); }
      .intro { padding: 36px 0 30px; }
      h1 { font-size: clamp(3.3rem, 18vw, 4.8rem); }
      .qr-panel { padding: 30px 28px; }
      .qr-frame { width: min(62vw, 240px); }
    }

    @media (max-width: 360px) {
      .identity, .qr-panel { padding-inline: 22px; }
      .contact { grid-template-columns: 1fr; gap: 1px; }
      .contact dd { margin-bottom: 6px; }
    }

    @media print {
      body { background: #fff; padding: 0; }
      .card { box-shadow: none; border-radius: 0; }
    }
  </style>
</head>

    function applyLanguage(lang) {
      currentLang = lang;
      const t = languageData[lang];
      document.documentElement.lang = lang;
      document.querySelector('.card').dataset.lang = lang;
      document.getElementById('personName').textContent = t.name;
      document.getElementById('personRole').textContent = t.role;
      document.getElementById('personHeadline').textContent = t.headline;
      document.getElementById('labelMobile').textContent = t.mobile;
      document.getElementById('labelOffice').textContent = t.office;
      document.getElementById('labelEmail').textContent = t.email;
      document.getElementById('labelAddress').textContent = t.addressLabel;
      document.getElementById('faxText').textContent = t.fax;
      document.getElementById('addressText').textContent = t.address;
      document.getElementById('qrTitle').textContent = t.qrTitle;
      document.getElementById('qrNote').textContent = t.qrNote;
      document.getElementById('callButton').textContent = t.call;
      document.getElementById('saveContact').textContent = t.saveContact;
      document.getElementById('saveCard').textContent = t.saveCard;
      qrImageElement.src = qrSources[lang];
      document.querySelectorAll('.lang-button').forEach(button => {
        const active = button.dataset.lang === lang;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    document.querySelectorAll('.lang-button').forEach(button => {
      button.addEventListener('click', () => applyLanguage(button.dataset.lang));
    });

    document.getElementById('saveContact').addEventListener('click', () => {
      const blob = new Blob([vCards[currentLang]], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = Object.assign(document.createElement('a'), { href: url, download: languageData[currentLang].contactFile });
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    const saveCardButton = document.getElementById('saveCard');
    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(message = '저장했어요 — 다운로드 폴더 확인') {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function canvasBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG 생성 실패')), 'image/png', 1);
      });
    }

    async function drawBusinessCard() {
      if (document.fonts?.ready) await document.fonts.ready;
      const lang = currentLang;
      const t = languageData[lang];

      const canvas = document.createElement('canvas');
      canvas.width = 1800;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d');
      const navy = '#18344a';
      const teal = '#167c75';
      const ink = '#172b3a';
      const muted = '#647784';

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1800, 1000);
      ctx.fillStyle = navy;
      ctx.fillRect(1180, 0, 620, 1000);

      const brandLogo = document.querySelector('.brand-logo');
      if (!brandLogo.complete) await new Promise((resolve, reject) => {
        brandLogo.addEventListener('load', resolve, { once: true });
        brandLogo.addEventListener('error', reject, { once: true });
      });
      if (brandLogo.decode) await brandLogo.decode();
      ctx.drawImage(brandLogo, 110, 105, 440, 63);

      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      ctx.fillStyle = navy;
      ctx.font = lang === 'ko'
        ? '850 132px "Noto Sans KR", "Malgun Gothic", sans-serif'
        : '850 100px Arial, sans-serif';
      ctx.fillText(t.name, 110, 410);
      ctx.fillStyle = ink;
      ctx.font = lang === 'ko'
        ? '750 42px "Noto Sans KR", "Malgun Gothic", sans-serif'
        : '750 34px Arial, sans-serif';
      ctx.fillText(t.role, 116, 480);
      ctx.fillStyle = teal;
      ctx.fillRect(116, 550, 44, 6);
      ctx.font = '800 39px "Noto Sans KR", "Malgun Gothic", sans-serif';
      ctx.fillText(t.headline, 180, 564);

      ctx.strokeStyle = '#dce4e8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(110, 665);
      ctx.lineTo(1060, 665);
      ctx.stroke();

      const rows = [
        [t.mobile, '010-2016-9785'],
        [t.office, lang === 'ko' ? '041-425-2480  ·  팩스 041-425-2491' : '+82-41-425-2480  ·  Fax +82-41-425-2491'],
        [t.email, 'neotech8282@hanmail.net'],
        [t.addressLabel, t.address]
      ];
      rows.forEach(([label, value], index) => {
        const y = 725 + index * 57;
        ctx.fillStyle = muted;
        ctx.font = '700 25px Arial, sans-serif';
        ctx.fillText(label, 116, y);
        ctx.fillStyle = ink;
        ctx.font = '500 27px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif';
        if (lang === 'en' && index === 3) {
          ctx.font = '500 22px Arial, sans-serif';
          ctx.fillText('119 Bongjae-gil 63beon-gil, Dunpo-myeon, Asan-si,', 300, y);
          ctx.fillText('Chungcheongnam-do, Republic of Korea', 300, y + 32);
        } else {
          ctx.fillText(value, 300, y);
        }
      });

      const qrImage = document.querySelector('.qr-image');
      if (!qrImage.complete) await new Promise((resolve, reject) => {
        qrImage.addEventListener('load', resolve, { once: true });
        qrImage.addEventListener('error', reject, { once: true });
      });
      if (qrImage.decode) await qrImage.decode();

      const qrX = 1260;
      const qrY = 150;
      const qrSize = 460;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(qrX - 18, qrY - 18, qrSize + 36, qrSize + 36, 24);
      ctx.fill();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);
      ctx.imageSmoothingEnabled = true;

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '800 34px "Noto Sans KR", "Malgun Gothic", sans-serif';
      ctx.fillText(t.qrTitle, 1490, 700);
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.font = '500 23px "Noto Sans KR", "Malgun Gothic", sans-serif';
      ctx.fillText(t.qrNote, 1490, 750);

      return canvas;
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = Object.assign(document.createElement('a'), {
        href: url,
        download: fileName
      });
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    saveCardButton.addEventListener('click', async () => {
      const originalText = saveCardButton.textContent;
      saveCardButton.disabled = true;
      saveCardButton.textContent = '이미지 만드는 중…';

      try {
        const canvas = await drawBusinessCard();
        const blob = await canvasBlob(canvas);
        const lang = currentLang;
        const t = languageData[lang];
        const file = new File([blob], t.fileName, { type: 'image/png' });
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile && navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
          await navigator.share({ title: lang === 'ko' ? '이선정 디지털 명함' : 'Lee Sun-jeong Digital Business Card', files: [file] });
        } else {
          downloadBlob(blob, t.fileName);
        }
        showToast();
      } catch (error) {
        if (error?.name !== 'AbortError') showToast('저장하지 못했어요 — 다시 시도해 주세요');
      } finally {
        saveCardButton.disabled = false;
        saveCardButton.textContent = originalText;
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
